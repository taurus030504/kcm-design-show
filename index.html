<style>
:root{
  --bg:#ffffff; --bg-2:#f5f5f6; --ink:#1b1b1d; --ink-2:#55565b; --ink-3:#97989d; --line:#ececee;
  --focus:#3355ff; --navy:#14204f; --org:#e8622c; --peach:#fbe6da; --serif:"Instrument Serif","Noto Serif KR",Georgia,serif; --kserif:"Noto Serif KR","Nanum Myeongjo",serif; --gut:16px; --max:1440px; --col:960px; --r:0;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#111113;--bg-2:#1c1c1f;--ink:#efeff1;--ink-2:#b4b5ba;--ink-3:#7c7d83;--line:#26262a;--focus:#8fa3ff}
}
:root[data-theme="dark"]{--bg:#111113;--bg-2:#1c1c1f;--ink:#efeff1;--ink-2:#b4b5ba;--ink-3:#7c7d83;--line:#26262a;--focus:#8fa3ff}
@media (min-width:768px){:root{--gut:32px}}
@media (min-width:1280px){:root{--gut:48px}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
ul{list-style:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 헤더 */
.hd{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:28px;height:80px;max-width:none;padding:0 64px}
@media (max-width:767px){.hd .wrap{height:60px;padding:0 var(--gut)}}
.brand{font-weight:900;font-size:18px;letter-spacing:-.04em;display:inline-flex;align-items:center;min-height:44px;white-space:nowrap}
.brand img{height:50px;width:auto;display:block}.brand img+span{display:none}
.brand-t{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:0}.brand-t i{color:var(--org)}
@media (max-width:767px){.brand-t{font-size:16px}}
@media (max-width:479px){.brand-t i,.brand-t .bc{display:none}}
.nav{display:flex;gap:2px;margin-left:auto!important}
@media (min-width:768px){.nav{margin-left:0}}
.nav a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 15px;font-size:16px;font-weight:400;letter-spacing:1px;color:var(--ink)}
@media (max-width:767px){.nav a{padding:0 8px;font-size:14px;letter-spacing:0}}
.nav a[aria-current="page"]{color:var(--org);font-weight:700}
.nav a:hover{color:var(--ink)}
main{flex:1;padding-bottom:80px}

/* 홈 */
.hero{display:grid;gap:32px;padding:36px 0 8px}
.hero .hk{font-size:13px;font-weight:500;color:var(--ink-2)}
.hero h1{margin-top:8px;font-size:34px;font-weight:900;letter-spacing:-.045em;line-height:1.1;text-wrap:balance}
.hero .hl{margin-top:16px;font-size:16px;line-height:1.7;color:var(--ink-2);max-width:34em;text-wrap:pretty}
.hero .hm{display:flex;gap:16px;margin-top:20px;font-size:14px;font-weight:700;color:var(--ink-2)}
.hero .btn{margin-top:28px}
.hc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-content:start}
.hc li{aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:var(--bg-2)}
.hc img{width:100%;height:100%;object-fit:cover;display:block}
.hc a{display:block;height:100%}
@media (min-width:768px){.hero{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:48px;align-items:center;padding:64px 0 24px;min-height:70vh}.hero h1{font-size:52px}.hero .hl{font-size:17px}.hc{gap:12px}}
@media (min-width:1100px){.hero{gap:72px}.hero h1{font-size:60px}}
.subs{padding-top:72px}
.subs h2,.more h2{font-size:20px;font-weight:900;letter-spacing:-.03em}
.subs ul{display:grid;gap:12px;margin-top:20px}
@media (min-width:768px){.subs ul{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}}
.subs a{display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px}
.subs a:hover{border-color:var(--ink-3)}
.subs .cv{aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:var(--bg-2);display:block}
.subs .cv img{width:100%;height:100%;object-fit:cover;display:block}
.subs .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.subs small{font-size:12px;color:var(--ink-3)}.subs b{font-size:17px;font-weight:700;letter-spacing:-.02em}.subs i{font-style:normal;font-size:13px;color:var(--ink-2)}
.cred{margin-top:64px;padding-top:24px;border-top:1px solid var(--line)}
.cred dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px;color:var(--ink-2)}.cred dt{color:var(--ink-3)}


/* ── 홈: 포스터 'Image Out, Draw the Dream' ── */
.fx-hero{position:relative;background:#fff;color:#111;overflow:hidden;isolation:isolate}
.fx-kv{position:absolute;z-index:-1;right:0;bottom:0;height:112%;width:auto;max-width:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%),linear-gradient(180deg,transparent 0,transparent 22%,#000 40%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,#000 30%),linear-gradient(180deg,transparent 0,transparent 22%,#000 40%);mask-composite:intersect}
.fx-in{position:relative;max-width:1440px;margin:0 auto;padding:56px 64px 72px;min-height:min(calc(100svh - 80px),920px);display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr);grid-template-rows:auto 1fr auto;column-gap:40px}
.fx-type{grid-column:1;grid-row:1/4;align-self:center;margin:0}
.fx-type{position:relative;max-width:720px}
.fx-type img{width:100%;height:auto;display:block}
.fx-type .b1{clip-path:inset(0 0 64% 0)}
.fx-type .b2,.fx-type .b3{position:absolute;left:0;top:0}
.fx-type .b2{clip-path:inset(36% 0 38% 0)}
.fx-type .b3{clip-path:inset(62% 0 0 0)}
/* 인트로: 리본 상승 + 줄 단위로 그려지듯 */
.fx-anim .fx-kv{animation:fxRise 1.4s cubic-bezier(.2,.8,.2,1) .15s both}
.fx-anim .b1{animation:fxW1 .8s cubic-bezier(.7,0,.2,1) .5s both}
.fx-anim .b2{animation:fxW2 .8s cubic-bezier(.7,0,.2,1) .75s both}
.fx-anim .b3{animation:fxW3 .8s cubic-bezier(.7,0,.2,1) 1s both}
.fx-anim .fx-info,.fx-anim .fx-cap{animation:fxFade .5s ease 1.5s both}
@keyframes fxRise{from{transform:translateY(38%);opacity:0}}
@keyframes fxW1{from{clip-path:inset(0 100% 64% 0)}}
@keyframes fxW2{from{clip-path:inset(36% 100% 38% 0)}}
@keyframes fxW3{from{clip-path:inset(62% 100% 0 0)}}
@keyframes fxFade{from{opacity:0}}
.fx-info{grid-column:2;grid-row:1;justify-self:end;text-align:right}
.fx-date{font-family:var(--font);font-size:clamp(26px,2.6vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.fx-date small{font-size:.45em;font-weight:500;margin-left:6px}
.fx-time{margin-top:10px;font-size:15px;font-weight:500}
.fx-place{margin-top:6px;font-size:17px;font-weight:700}
.fx-addr{margin-top:4px;font-size:14px;color:var(--navy)}
.fx-go{display:inline-flex;align-items:center;gap:8px;min-height:44px;margin-top:20px;padding:0 20px;border:1px solid #111;font-size:14px;font-weight:700;letter-spacing:.5px;background:#fff}
.fx-go:hover{background:var(--org);border-color:var(--org);color:#fff}
.fx-cap{grid-column:2;grid-row:3;justify-self:end;text-align:right;font-size:14px;font-weight:700;line-height:1.6;color:#fff;text-shadow:0 1px 8px rgba(20,32,80,.6)}
@media (max-width:1023px){
 .fx-in{grid-template-columns:1fr;grid-template-rows:auto;padding:28px var(--gut) 0;min-height:0;row-gap:28px}
 .fx-info{grid-column:1;grid-row:1;justify-self:start;text-align:left}
 .fx-type{grid-column:1;grid-row:2}
 .fx-type{max-width:560px}
 .fx-cap{display:none}
 .fx-hero{display:flex;flex-direction:column}
 .fx-kv{position:relative;order:2;z-index:-1;display:block;width:100%;height:auto;aspect-ratio:1/1.05;object-fit:cover;object-position:70% 100%;margin-top:-22%;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 30%);mask-image:linear-gradient(180deg,transparent 0,#000 30%)}
}
.perf{height:34px;background:var(--navy) radial-gradient(circle,transparent 0,transparent 0) ;position:relative}
.perf::before{content:"";position:absolute;inset:9px 0;background:repeating-linear-gradient(90deg,#fff 0 14px,transparent 14px 32px);border-radius:3px;-webkit-mask:linear-gradient(#000 0 0);opacity:.95}
.fx-k{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1;color:var(--org)}
.fx-h{margin:0;font-family:var(--kserif);font-size:clamp(30px,3.4vw,48px);font-weight:700;line-height:1.3;letter-spacing:-.03em;color:var(--ink)}
.fx-h em,.fx-txt em{font-style:normal;color:var(--org)}
.fx-intro{background:var(--peach);color:#1b1b1d}
.fx-intro .fx-h{color:#111}
.fx-in2{max-width:1140px;margin:0 auto;padding:96px var(--gut);display:grid;gap:48px;align-items:center}
@media (min-width:900px){.fx-in2{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:80px;padding:120px var(--gut)}}
.fx-poster{margin:0;justify-self:center;width:100%;max-width:440px}
.fx-poster img{width:100%;height:auto}
.fx-poster figcaption{margin-top:12px;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--navy)}
.fx-en{margin-top:6px;font-family:var(--serif);font-size:24px;color:var(--navy)}
.fx-txt{margin-top:28px}
.fx-txt p{font-size:16px;line-height:1.9;color:#333;margin-bottom:1.2em}
.fx-num{display:flex;gap:36px;margin-top:32px;padding-top:24px;border-top:1px solid rgba(20,32,80,.2)}
.fx-num dt{font-size:13px;color:var(--navy)}
.fx-num dd{font-family:var(--serif);font-size:56px;line-height:1;color:#111}
.fx-sec{max-width:1240px;margin:160px auto 0;padding:0 var(--gut)}
@media (max-width:767px){.fx-sec{margin-top:96px}}
.fx-sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:40px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.fx-sh .fx-h{margin:0}
.fx-cnt{font-family:var(--serif);font-size:40px;line-height:1;color:var(--org)}
.fx-sd{margin-top:10px;font-size:16px;color:var(--ink-2)}
.reel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}
@media (min-width:768px){.reel{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 20px}}
.frame{display:block;position:relative;background:var(--navy);color:#fff;padding:28px 12px 58px;
  background-image:repeating-linear-gradient(90deg,#fff 0 9px,transparent 9px 22px),repeating-linear-gradient(90deg,#fff 0 9px,transparent 9px 22px);
  background-size:100% 8px,100% 8px;background-position:10px 11px,10px calc(100% - 48px);background-repeat:no-repeat}
.frame .cv{display:block;aspect-ratio:1;overflow:hidden;background:#0c1538}
.frame .cv img{width:100%;height:100%;object-fit:cover;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.frame:hover .cv img{transform:scale(1.04)}
.fr-no{position:absolute;top:8px;right:12px;font-family:ui-monospace,"DejaVu Sans Mono",monospace;font-size:11px;font-weight:700;color:var(--org);background:var(--navy);padding-left:6px}
.fr-tx{position:absolute;left:12px;right:12px;bottom:10px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 8px}
.fr-tx b{font-size:17px;font-weight:700}
.fr-tx small{font-size:12px;color:#c9cfe6}
.frame:hover .fr-tx b{color:var(--org)}
.fx-greet .car{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fx-greet .car-q{font-family:var(--kserif);font-size:24px;line-height:1.7;font-weight:500;color:var(--ink)}
.fx-greet .qm{fill:var(--org);opacity:.25}
@media (max-width:767px){.fx-greet .car-q{font-size:18px}}
.fx-visit .fx-vb{display:grid;gap:32px;padding:20px 0 0;border-top:2px solid var(--ink)}
@media (min-width:768px){.fx-visit .fx-vb{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}}
.fx-dl{display:grid;gap:18px}
.fx-dl div{display:grid;grid-template-columns:88px 1fr;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.fx-dl dt{font-size:14px;color:var(--ink-3)}
.fx-dl dd{font-size:17px;font-weight:700}.fx-dl small{font-size:14px;font-weight:400;color:var(--ink-2)}
main:has(.fx-hero){padding-bottom:120px}
.ft-logos{height:26px;width:auto;margin-top:14px}
.ft-row{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:28px 48px}
.ft-l p{margin:0;font-size:14px;font-weight:500;line-height:1.75;color:#d6d6d8}
.ft-l .ft-logos{display:block;margin:0 0 10px}
.ft-l a{color:inherit;text-decoration:none}.ft-l a:hover{text-decoration:underline;text-underline-offset:3px}
.ft-r{display:flex;align-items:flex-start;gap:48px}
.ft-cr{margin:0;font-size:14px;line-height:1.75;color:#d6d6d8}
.ft-cr dt{font-weight:700;color:#fff;margin-bottom:10px;line-height:26px}
.ft-cr dd{margin:0;display:flex;gap:24px;color:#d6d6d8}.ft-cr dd span{font-weight:400;color:#d6d6d8}
.ft-sns{display:flex;gap:16px;margin-top:-9px;margin-right:-9px}
.ft-sns a{display:grid;place-items:center;width:44px;height:44px;color:#fff;transition:color .2s}
.ft-sns a:hover{color:#e8622c}
.ft-sns a:focus-visible{outline:2px solid currentColor;outline-offset:2px}
@media (max-width:767px){.ft-r{flex-direction:column;gap:20px}.ft-sns{margin-left:-10px}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ft-logos{background:#fff;padding:6px 10px;border-radius:4px;box-sizing:content-box}}
:root[data-theme="dark"] .ft-logos{background:#fff;padding:6px 10px;border-radius:4px;box-sizing:content-box}


/* 작품 흐름 (MUBI + 전주국제영화제) */
.flow{position:relative;margin-top:-8px}
.flow-tr{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding:0 var(--gut);-webkit-overflow-scrolling:touch}
.flow-tr::-webkit-scrollbar{display:none}
.flow-tr:focus-visible{outline:2px solid var(--org);outline-offset:2px}
.fl{position:relative;flex:0 0 auto;width:clamp(180px,18vw,260px);aspect-ratio:1/1.414;overflow:hidden;background:#111;color:#fff}
.fl img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.fl::after{display:none;content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.35) 70%,rgba(0,0,0,.82) 100%);transition:opacity .3s}
.fl:hover img{transform:scale(1.04)}
.flow-b{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:56px;height:72px;display:grid;place-items:center;background:none;border:0;cursor:pointer}
.flow-b svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:2.2;filter:drop-shadow(0 1px 3px rgba(0,0,0,.55));transition:transform .2s}
.flow-b.prev{left:12px}.flow-b.next{right:12px}
.flow-b:hover svg{stroke:var(--org)}.flow-b.prev:hover svg{transform:translateX(-3px)}.flow-b.next:hover svg{transform:translateX(3px)}.flow-b:focus-visible{outline:2px solid var(--org)}
@media (max-width:767px){.flow-b{display:none}}


/* 과목 페이지: 어두운 배너 */
.sb-hero{position:relative;overflow:hidden;background:#000;color:#fff;text-align:center;isolation:isolate}
.sb-bg{position:absolute;inset:-6%;z-index:-2;display:grid;grid-template-columns:repeat(6,1fr);filter:grayscale(1) contrast(1.1) blur(1.5px);opacity:.55;transform:rotate(-2deg) scale(1.08)}
.sb-bg img{width:100%;aspect-ratio:1;object-fit:cover}
.sb-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.78) 60%,rgba(0,0,0,.9))}
.sb-in{max-width:960px;margin:0 auto;padding:96px var(--gut);min-height:clamp(440px,62vh,640px);display:flex;flex-direction:column;justify-content:center}
@media (max-width:767px){.sb-in{min-height:420px;padding:64px var(--gut)}}
.sb-k{font-size:14px;font-weight:500;color:rgba(255,255,255,.7);letter-spacing:.04em}
.sb-hero h1{margin-top:14px;font-size:clamp(32px,4vw,54px);font-weight:800;line-height:1.2;letter-spacing:-.03em}
.sb-i{margin-top:20px;font-size:clamp(14px,1.15vw,16px);line-height:1.8;color:rgba(255,255,255,.82);text-wrap:balance}
.sb-tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:1240px;margin:0 auto;padding:56px var(--gut) 56px}
.sb-tabs a{display:inline-flex;align-items:center;min-height:52px;padding:0 28px;border:1.5px solid #111;font-size:17px;font-weight:700;letter-spacing:.08em;color:#111;background:#fff}
.sb-tabs a:hover{border-color:var(--org);color:var(--org)}
.sb-tabs a[aria-current="page"]{background:#111;color:#fff;border-color:#111}
.sb-tabs a.on{border-color:#111;box-shadow:inset 0 -3px 0 #111}
.sb-sub{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 28px;margin:-28px auto 0;padding:0 var(--gut) 48px}
.sb-sub a,.sb-sub button{padding:8px 2px;font:inherit;font-size:15px;font-weight:500;color:var(--ink-2);background:none;border:0;border-bottom:2px solid transparent;cursor:pointer}
.sb-sub a:hover,.sb-sub button:hover{color:var(--org)}
.sb-sub a[aria-current="page"]{color:#111;font-weight:700;border-bottom-color:#111}
.gs{padding:56px 0 24px;border-top:1px solid #111;scroll-margin-top:96px}
.gs:first-child{border-top:0;padding-top:8px}
.gs-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
.gs-h h2{font-size:clamp(24px,2.4vw,32px);font-weight:800;letter-spacing:-.03em;line-height:1.2}
.gs-h p{margin-top:6px;font-size:14px;color:var(--ink-3)}
.gs-h a{flex:0 0 auto;font-size:14px;font-weight:700;color:#111;border-bottom:1.5px solid #111;padding-bottom:2px}

const SHOW={"title":"2026 디자인콘텐츠과 과제전","school":"한국문화영상고등학교","intro":"디자인콘텐츠과 학생들이 올해 만든 작품을 모았습니다.","logo":"img/logo.svg","lead":"디자인콘텐츠과 1, 2, 3학년이 한 해 동안 수업에서 만든 작품 75점을 한자리에 모았습니다.","hero":["w1407-card","w1422-card","w2403-ci","w2423-ci","w2413-ill","w2420-ill","w2408-inf","w2417-inf","w3403-char","w3406-char","w3405-int","w3414-int"],"greets":[{"id":"principal","role":"교장","name":"강성민","photo":"img/greet-principal.jpg","body":["2026년을 마무리하는 계절에 한해의 결실을 거두듯이 우리 학교 디자인콘텐츠과의 과제 전시회를 통해 학생들의 노력의 산물을 함께 즐기게 되어 매우 기쁘게 생각합니다.","특별히 올해는 디자인콘텐츠과가 3개 학년으로 완성된 첫 해이기도 합니다. 그래서 이번 과제 전시회는 3년 동안 디자인콘텐츠과에 입학한 학생 여러분의 꿈과 기량이 우리의 눈 앞에 펼쳐지는 뜻깊은 시간입니다. 그동안 학생들이 보여준 무한한 가능성은 우리 학교의 밝은 미래를 보여주고 있다는 생각이 듭니다.","모든 디자인 작품의 원동력은 자유로운 발상과 창의적인 사고를 통해 생겨납니다. 우리 한국문화영상고의 디자인콘텐츠과 학생들의 상상력과 창의력이 흠씬 풍겨 나오는 작품들이 아직은 작은 창작물에 불과할 지라도 언젠가는 대한민국의 K 디자인 파워를 일으킬 큰 잠재력이 있다고 생각합니다. 여러분들의 꿈과 열정으로 우리나라가 디자인 강국으로 자리매김 하리라고 저는 믿고 있습니다.","우리 학교는 여러분들의 꿈을 펼칠 수 있는 큰 나무가 되겠습니다. 그리고 그 나무는 여러분들이 세상에 나아가도록 든든한 버팀목이 되어 드리겠습니다. 디자인콘텐츠과를 위해 평소 애쓰시는 지도 선생님들께도 감사의 박수를 드립니다. 여러분들이 그려나갈 아름다운 세상을 상상해 봅니다.","감사합니다."],"quote":"여러분들의 꿈과 열정으로 우리나라가 디자인 강국으로 자리매김 하리라고 저는 믿고 있습니다."},{"id":"vice","role":"교감","name":"이이호","photo":"img/greet-vp.jpg","body":["디자인콘텐츠과 학생들이 수많은 고민과 열정으로 완성한 작품 전시회에 함께해 주신 모든 분을 진심으로 환영합니다.","디자인은 내면의 생각과 감정을 세상 밖으로 꺼내어 타인과 공감하는 과정입니다. 지난 학교생활 동안 디자인콘텐츠과 교실과 실습실을 밝히던 아이들의 열정적인 눈빛, 끊임없이 수정하고 고민하던 진지한 뒷모습들이 스쳐 지나갑니다.","오늘 이 자리에 전시된 작품들은 단순히 완성된 결과물이 아니라, 실패를 두려워하지 않고 끊임없이 도전해 온 학생들의 소중한 성장의 기록입니다. 자신만의 시선으로 세상을 바라보고, 그것을 고유한 색깔과 콘텐츠로 표현해 낸 우리 학생들이 참으로 대견하고 자랑스럽습니다.","든든한 버팀목이 되어주신 학부모님, 그리고 헌신적인 지도와 사랑으로 아이들의 길잡이가 되어주신 선생님들께 가슴 깊이 감사드립니다.","전시장을 찾아주신 모든 분께서도 학생들의 작품에 담긴 이야기를 마음으로 느껴주시고, 앞으로 세상이라는 더 넓은 도화지 위에 멋진 꿈을 펼쳐갈 우리 학생들에게 따뜻한 응원을 보내주시기 바랍니다. 감사합니다."],"quote":"오늘 이 자리에 전시된 작품들은 단순히 완성된 결과물이 아니라, 실패를 두려워하지 않고 끊임없이 도전해 온 학생들의 소중한 성장의 기록입니다."},{"id":"head","role":"디자인부장","name":"유성이","photo":"img/greet-head.jpg","body":["안녕하세요. 한국문화영상고등학교 디자인콘텐츠과를 담당하는 교사 유성이입니다.","이번 과제전은 학생들이 수업과 실습을 통해 배우고 익힌 디자인 역량을 바탕으로 자신만의 생각과 개성을 작품으로 표현한 소중한 결실의 자리입니다.","하나의 작품이 완성되기까지 학생들은 수많은 고민과 도전, 시행착오를 경험했습니다. 때로는 어려움에 부딪히기도 했지만, 끊임없이 배우고 시도하며 자신만의 창의적인 결과물을 만들어냈습니다.","이번 전시가 단순히 완성된 작품을 보여주는 자리를 넘어, 학생들이 자신의 가능성을 발견하고 서로의 생각과 감성을 나누며 한 걸음 더 성장하는 기회가 되기를 바랍니다.","앞으로도 디자인콘텐츠과 학생들이 창의적인 사고와 도전 정신을 바탕으로 미래 디자인 분야를 이끌어갈 인재로 성장할 수 있도록 아낌없는 응원과 지도를 이어가겠습니다. 끝으로 이번 과제전을 위해 노력한 학생들과 지도해 주신 선생님들께 깊은 감사드립니다."],"quote":"이번 전시가 단순히 완성된 작품을 보여주는 자리를 넘어, 학생들이 자신의 가능성을 발견하고 한 걸음 더 성장하는 기회가 되기를 바랍니다."}],"teachers":["유성이","서명희","김선진","황현정"],"concept":{"title":"이미지 속에서 나와, 꿈을 그리기까지","ko":["이미지 속에서 나와,","꿈을 그리기까지"],"en":["Image Out,","Draw the Dream"],"body":[["우리에게 디자인은","좋아하던 영화와 만화 게임과 광고 속에서 보기만 하던 이미지였습니다."],["디자인콘텐츠과에서 보낸 한 해 동안 학생들은","그 이미지 밖으로 나와 직접 기획하고 꿈을 그렸습니다."],["카드뉴스로 시작해 브랜드와 인포그래픽을 지나","캐릭터와 공간까지. 세 학년이 각자의 꿈을 그린","작품들을 소개합니다."]]},"key":"img/key.jpg","poster":"img/poster.jpg","type":"img/type_main.png","logos":"img/type_logos.png","date":"2026.12.22","day":"Tue","time":"17:00","place":"동두천시평생교육원","addr":"동두천시 지행동 722-1번지"};

function card(wk,g){
  const st=S(wk.student), gg=g||SUBJECTS[wk.subject].grade;
  return `<li class="ci"><a class="card" href="#/work/${wk.id}">
    <div class="cv"><img src="${wk.sq.replace('sq.jpg','tn.jpg')}" alt="${esc(wk.title)}" loading="lazy" decoding="async" width="600" height="848"></div>
    <div class="cap"><p class="t">${esc(wk.title)}</p>
    ${wk.desc?`<p class="d">${esc(wk.desc)}</p>`:''}
    <p class="by">${esc(st.name)}</p></div>
  </a></li>`;
}
const subList=()=>Object.entries(SUBJECTS).map(([k,v])=>({k,...v,n:WORKS.filter(x=>x.subject===k).length}));
function stabs(cur){
  return `<nav class="stabs" aria-label="과목">${subList().map(s=>`<a href="#/subject/${s.k}"${s.k===cur?' aria-current="page"':''}><small>${esc(GRADES[s.grade])}</small>${esc(s.name)}<i>${s.n}</i></a>`).join('')}</nav>`;
}
function subHead(k,tag){
  const v=SUBJECTS[k];
  return `<header class="shd"><p class="sk">${esc(GRADES[v.grade])} ${esc(v.course)}</p><${tag}>${esc(v.name)}</${tag}></header>`;
}
const GINTRO={
  1:["1학년은 포토샵과 일러스트레이터를 이번에 처음 다뤄 봤습니다.","카드뉴스를 먼저 만들고, 이어서 실제 제품 광고를 만들었습니다."],

function sbHero(list,k,t,i){
  const bg=[...list,...list,...list].slice(0,12);
  return `<section class="sb-hero" aria-labelledby="sb-t">

      <div class="sb-in">${k?`<p class="sb-k">${esc(k)}</p>`:''}<h1 id="sb-t">${esc(t)}</h1>${i&&i.length?`<p class="sb-i">${i.map(esc).join('<br>')}</p>`:''}</div>
    </section>`;
}
function gTabs(g,k){
  const subs=subsOf(g);
  return `<nav class="sb-tabs" aria-label="학년">${[1,2,3].map(n=>`<a href="#/grade/${n}"${n==g&&!k?' aria-current="page"':n==g?' class="on"':''}>${GRADES[n]}</a>`).join('')}</nav>
    ${subs.length>1?`<nav class="sb-sub" aria-label="${GRADES[g]} 과목">${subs.map(s=>k?`<a href="#/subject/${s}"${s===k?' aria-current="page"':''}>${esc(SUBJECTS[s].name)}</a>`:`<button type="button" data-jump="g-${s}">${esc(SUBJECTS[s].name)}</button>`).join('')}</nav>`:''}`;
}
const NO=s=>s.id.slice(1);
function fbar(g,st){return `<div class="fbar wrap"><p><small>${NO(st)}</small><b>${esc(st.name)}</b>의 작품</p><a href="#/grade/${g}">${esc(GRADES[g])} 전체 보기</a></div>`}
function idx(g){
  const sts=STUDENTS.filter(s=>s.grade==g).sort((x,y)=>x.id.localeCompare(y.id));
  return `<section class="ix" aria-label="${esc(GRADES[g])} 학생 목록"><div class="wrap">
    <div class="ix-g">${sts.map(s=>{const ws=BYNO.filter(w=>w.student===s.id);return `<div class="ix-p"><a class="ix-n" href="#/grade/${g}/${s.id}"><small>${NO(s)}</small>${esc(s.name)}</a>${ws.map(w=>`<a class="ix-w" href="#/work/${w.id}">${esc(w.title)}</a>`).join('')}</div>`}).join('')}</div></div></section>`;
}
function pairs(g){
  const sts=STUDENTS.filter(s=>s.grade==g).sort((x,y)=>x.id.localeCompare(y.id));
  return `<ul class="pr-g">${sts.map(s=>{const ws=BYNO.filter(w=>w.student===s.id);if(!ws.length)return '';return `<li class="pr" style="--n:${ws.length}"><a class="pr-h" href="#/grade/${g}/${s.id}"><small>${NO(s)}</small><b>${esc(s.name)}</b></a><ul class="grid pr-in">${ws.map(w=>card(w,g)).join('')}</ul></li>`}).join('')}</ul>`;
}
function vGrade(g,sid){
  const subs=subsOf(g), all=BYNO.filter(x=>SUBJECTS[x.subject].grade==g);

  if(st){const ws=BYNO.filter(w=>w.student===sid);

    <div class="wrap"><ul class="grid fgrid">${ws.map(w=>card(w,g)).join('')}</ul></div>${MV==='2'?idx(g):''}`;}
  const body=MV==='3'?`<div class="wrap">${pairs(g)}</div>`:`<div class="wrap">${subs.map(s=>{const v=SUBJECTS[s],list=BYNO.filter(x=>x.subject===s);
      return `<section class="gs" id="g-${s}" aria-labelledby="gh-${s}"><header class="gs-h"><div><h2 id="gh-${s}">${esc(v.name)}</h2><p>${esc(v.course)}</p></div></header>
      ${list.length?`<ul class="grid">${list.map(w=>card(w,g)).join('')}</ul>`:`<p class="empty">준비 중</p>`}</section>`}).join('')}</div>`;
  return `${sbHero(all,'',GRADES[g],GINTRO[g])}
    ${gTabs(g)}${body}${MV==='2'?idx(g):''}`;
}

async function card(wk){const c=await window.CARDV2(wk,'g');return await new Promise(r=>c.toBlob(r,'image/png'))}
async function open(wk){cur=wk;url=location.href;MSG.textContent='카드를 만드는 중이에요';M.hidden=false;IM.removeAttribute('src');
 try{blob=await card(wk);IM.src=URL.createObjectURL(blob);MSG.textContent=''}catch(e){MSG.textContent='카드를 만들지 못했어요. 링크 복사를 이용해 주세요.'}
 M.querySelector('.shc-b .pri').focus()}
function close(){M.hidden=true}
M.querySelector('.shc-x').onclick=close;M.onclick=e=>{if(e.target===M)close()};addEventListener('keydown',e=>{if(e.key==='Escape'&&!M.hidden)close()});
const fname=()=>`kcm-show-${cur.id.replace(/^w/,'')}.png`;
function save(){if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname();document.body.append(a);a.click();a.remove();MSG.textContent='이미지를 저장했어요'}
async function link(){try{await navigator.clipboard.writeText(url);MSG.textContent='링크를 복사했어요'}catch(e){MSG.textContent=url}}
M.querySelector('[data-s="save"]').onclick=save;M.querySelector('[data-s="link"]').onclick=link;
M.querySelector('[data-s="share"]').onclick=async()=>{const st=STUDENTS.find(s=>s.id===cur.student)||{name:''};const text=`${cur.title} ${st.name} | 제3회 과제전`;
 try{if(blob&&navigator.canShare&&navigator.canShare({files:[new File([blob],fname(),{type:'image/png'})]})){await navigator.share({files:[new File([blob],fname(),{type:'image/png'})],title:text,text:text+'\n'+url});return}
  if(navigator.share){await navigator.share({title:text,url});return}}catch(e){if(e.name==='AbortError')return}
 save();link()};
// 작품 페이지의 공유 버튼을 가로챔
document.addEventListener('click',e=>{const b=e.target.closest('[data-act="share"]');if(!b)return;const m=location.hash.match(/^#\/work\/([^/]+)/);if(!m)return;
 const wk=WORKS.find(w=>w.id===decodeURIComponent(m[1]));if(!wk)return;e.preventDefault();e.stopImmediatePropagation();open(wk)},true);
})();
